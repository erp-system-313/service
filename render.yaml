services:
  - type: web
    name: erp-backend
    env: java
    rootDir: service
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java $JAVA_OPTS -jar target/erp-backend-1.0.0-SNAPSHOT.jar --spring.profiles.active=prod
    envVars:
      - key: JAVA_OPTS
        value: -Xmx512m
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        sync: false
    disk:
      name: logs
      mountPath: /opt/render/project/src/service/logs
      sizeGB: 1
