services:
  - type: web
    name: erp-backend
    runtime: docker
    healthCheckPath: /api-docs
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATA_REDIS_HOST
        sync: false
      - key: SPRING_DATA_REDIS_PORT
        value: "6379"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SPRING_FLYWAY_VALIDATE_ON_MIGRATE
        value: "false"

databases:
  - name: erp-db
    databaseType: postgres
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

redis:
  - name: erp-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
