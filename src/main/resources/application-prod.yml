spring:
  datasource:
    url: jdbc:${DATABASE_URL:jdbc:postgresql://localhost:5432/erp}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    com.erp: INFO
    org.springframework.security: WARN
    org.hibernate: DEBUG
    org.hibernate.tool.schema.internal: DEBUG
  file:
    name: logs/erp-backend.log
